name: Generate Profile Graphics

on:
  schedule:
    - cron: "0 * * * *" # tiap 12 jam
  workflow_dispatch: # bisa dijalankan manual dari tab Actions
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-graphics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Ambil hasil sebelumnya sebagai cadangan (branch belum ada saat run pertama)
      - name: Ambil hasil lama
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: output
          path: prev

      # 🐍 Snake animation (versi terang & gelap)
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # 📊 Kartu stats, bahasa, dan aktivitas
      # Pakai secret GH_PAT kalau ada (kontribusi privat ikut terhitung),
      # kalau tidak ada otomatis memakai GITHUB_TOKEN bawaan.
      - name: Generate stats cards
        continue-on-error: true # kalau gagal, snake tetap dipublikasikan
        run: python3 .github/scripts/generate_cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          OUT_DIR: dist

      # Kalau ada file yang gagal dibuat, pakai versi lama supaya gambar README tidak rusak
      - name: Pakai file lama jika generate gagal
        if: always()
        run: |
          mkdir -p dist
          cp -n prev/*.svg dist/ 2>/dev/null || true

      # Simpan semua hasil ke branch "output" supaya branch utama tetap bersih
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
